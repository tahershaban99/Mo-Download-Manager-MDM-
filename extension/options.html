<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mo Download Manager (MDM) - Settings</title>
<style>
  body { font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #0f172a; margin: 0; padding: 18px 22px; min-width: 420px; background: #f8fafc; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 18px; }
  h2 img { width: 28px; height: 28px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #e2e8f0; }
  label { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  select { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  input[type=number] { width: 90px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  .saved { color: #10b981; font-size: 12px; height: 16px; margin-top: 8px; }
</style>
</head>
<body>
  <h2><img src="icons/icon48.png" alt="">Mo Download Manager (MDM) — Settings</h2>
  <div class="card">
    <label><input type="checkbox" id="intercept"> Send browser downloads to Mo Download Manager (MDM)</label>
    <label>Ignore files smaller than <input type="number" id="minSize" min="0"> KB</label>
    <label>App port <input type="number" id="port" min="1024" max="65535"></label>
    <label>Size of the "Download this video" button
      <select id="bubbleSize">
        <option value="small">Small</option>
        <option value="normal">Normal</option>
        <option value="large">Large</option>
      </select>
    </label>
  </div>
  <div class="saved" id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
