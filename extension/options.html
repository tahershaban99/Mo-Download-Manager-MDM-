<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mo Download Manager (MDM) - Settings</title>
<style>
  * { box-sizing: border-box; }
  body {
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #e2e8f0;
    margin: 0;
    padding: 22px 26px;
    min-width: 440px;
    min-height: 100vh;
    background: radial-gradient(circle at top right, #0d1f3d 0%, #090d18 70%);
  }
  h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 16px;
    font-size: 17px;
    color: #f8fafc;
    text-shadow: 0 0 12px rgba(0, 180, 255, 0.35);
  }
  h2 img { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.5)); }
  .card {
    background: rgba(13, 20, 36, 0.88);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 180, 255, 0.14);
    border: 1px solid rgba(0, 229, 255, 0.28);
  }
  label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
    color: #cbd5e1;
  }
  input[type=checkbox] {
    accent-color: #00d2ff;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  select, input[type=number] {
    padding: 5px 10px;
    background: rgba(9, 13, 24, 0.9);
    color: #f1f5f9;
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 6px;
    font: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input[type=number]:focus {
    border-color: #00f0ff;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
  }
  input[type=number] { width: 96px; }
  .saved {
    color: #00f59b;
    text-shadow: 0 0 8px rgba(0, 245, 155, 0.35);
    font-size: 12.5px;
    font-weight: 600;
    height: 18px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h2><img src="icons/icon48.png" alt="">Mo Download Manager (MDM) — Settings</h2>
  <div class="card">
    <label><input type="checkbox" id="intercept"> Send browser downloads to Mo Download Manager (MDM)</label>
    <label>Ignore files smaller than <input type="number" id="minSize" min="0"> KB</label>
    <label>App port <input type="number" id="port" min="1024" max="65535"></label>
    <label>Size of the "Download this video" button
      <select id="bubbleSize">
        <option value="small">Small</option>
        <option value="normal">Normal</option>
        <option value="large">Large</option>
      </select>
    </label>
  </div>
  <div class="saved" id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
